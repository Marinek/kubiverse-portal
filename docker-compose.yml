services:
  mock:
    build:
      context: ./mock
    ports:
      - "12004:12004"
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - ARGOCD_URL=http://mock:12004
      - SPRING_PROFILES_ACTIVE=no-db
    ports:
      - "8080:8080"
    depends_on:
      - mock
    restart: unless-stopped

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
      args:
        - VITE_ARGOCD_UI_URL=https://argocd.fms-kubiverse.materna.net/
        - VITE_TEAMS_CHAT_URL=https://teams.microsoft.com/l/channel/19%3A72ac354d15d5442b99836a316d511dd0%40thread.tacv2/Support%20-%20Build%2C%20VM%2C%20DB?groupId=dfb3d278-87f9-49b3-8a6e-16efa9282298&tenantId=72e67b6b-5fe2-4c81-ba51-be2b36a693a0
        - VITE_DOCS_DEPLOYMENT_GUIDE_URL=https://wiki.materna.net/x/74cCCg
        - VITE_DOCS_CONVENTIONS_URL=https://wiki.materna.net/x/dIl
        - VITE_DOCS_CICD_PIPELINE_URL=https://wiki.materna.net/x/HYL7KQ
        - VITE_DOCS_TROUBLESHOOTING_URL=https://wiki.materna.net/x/A4KRL
        - VITE_DOCS_FLYER_URL=https://wiki.materna.net/x/RwGgJg
    ports:
      - "80:80"
    depends_on:
      - mock
      - server
    restart: unless-stopped
