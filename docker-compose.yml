services:
  mock:
    build:
      context: ./mock
    ports:
      - "12004:12004"
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      - ARGOCD_URL=http://mock:12004
      - SPRING_PROFILES_ACTIVE=no-db
    ports:
      - "8080:8080"
    depends_on:
      - mock
    restart: unless-stopped

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - mock
      - server
    restart: unless-stopped

  gitea:
    image: gitea/gitea:1.21.0
    environment:
      - USER_UID=1000
      - USER_GID=1000
    restart: always
    ports:
      - "3000:3000"
      - "2222:22"

  jenkins:
    image: jenkins/jenkins:lts
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--prefix=/jenkins
    restart: unless-stopped
