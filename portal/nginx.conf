server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Basis-Hardening
  server_tokens off;

  # 1) API Reverse Proxy zur Vermeidung von CORS-Problemen
  location /kubiverse/api/ {
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 2) SPA-Fallback: alle unbekannten Routen auf index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 2) Index nicht cachen (damit neue Deployments sofort sichtbar sind)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    try_files $uri =404;
  }

  # 3) Statische, fingerprinted Vite-Assets lange cachen
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot|map)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # 4) Sicherheitsheader (leichtgewichtig; CSP ggf. projektspezifisch schärfen)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # 5) gzip für Text-/Script-Assets
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;
}
