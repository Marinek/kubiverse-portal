server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Basis-Hardening
  server_tokens off;

  # 1a) API Reverse Proxy zum Java-Server (für ArgoCD etc.)
  location /kubiverse/api/ {
    # Secure Share: Dateien bis 10 MB plus Multipart-Overhead
    client_max_body_size 11m;
    proxy_pass http://server:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 1b) API Reverse Proxy zum neuen Node.js Orchestrator
  location /orchestrator/api/ {
    proxy_pass http://orchestrator:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # 2) SPA-Fallback: alle unbekannten Routen auf index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 2) Index nicht cachen (damit neue Deployments sofort sichtbar sind)
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # 3) Statische, fingerprinted Vite-Assets lange cachen
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?|ttf|eot|map)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  # 4) Sicherheitsheader inkl. CSP (siehe security-headers.conf)
  include /etc/nginx/snippets/security-headers.conf;

  # 5) gzip für Text-/Script-Assets
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    application/javascript
    application/json
    application/xml
    application/rss+xml
    image/svg+xml;
}
